name: CI

# Baut die native Swift-App, laeuft die Tests, prueft die JS-Parität und
# stellt sicher, dass die gebaute Single-File-HTML aktuell ist.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # macos-15 bringt standardmaessig Xcode 16 / Swift 6.0 mit; der aeltere
    # macos-14-Runner hatte nur Swift 5.10 und scheiterte an
    # 'swift-tools-version: 6.0' in Package.swift.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Kontext- und Doku-Regeln
        run: python3 Tests/context_hygiene_tests.py

      # Die UI-Quelltests kodieren die Pflichtbedienelemente des kompakten
      # Transports — ohne diesen Schritt koennten sie verschwinden, ohne dass
      # CI rot wird.
      - name: UI-Quelltests
        run: python3 Tests/ui_source_tests.py

      # Liest nur den Quelltext der Bau-/Installationsskripte: Ad-hoc-Builds
      # bleiben im Projektordner, nach /Applications greift allein install.sh —
      # und nur mit angeheftetem Notary-Ticket. Der Test baut und installiert
      # bewusst nichts.
      - name: Bau- und Installationsskripte (Quelltest)
        run: python3 Tests/build_script_tests.py

      - name: Swift Version
        run: swift --version

      - name: Swift build (release)
        run: swift build -c release

      # Quick-Look-Appex und App-Bundle entstehen NUR in build_app.sh (eigener
      # swiftc-Aufruf) — swift build allein wuerde Build- oder Plist-Fehler der
      # ausgelieferten Extension nicht bemerken. SIGN_APP=0: unsignierter Lauf,
      # auf dem Runner gibt es keine Developer-ID.
      - name: App-Bundle samt Quick-Look-Appex (unsigniert)
        run: |
          SIGN_APP=0 bash build_app.sh
          plutil -lint "Savage Mod Player.app/Contents/Info.plist"
          plutil -lint "Savage Mod Player.app/Contents/PlugIns/SavageModPlayerQuickLook.appex/Contents/Info.plist"
          test -x "Savage Mod Player.app/Contents/MacOS/SavageModPlayerApp"
          test -x "Savage Mod Player.app/Contents/PlugIns/SavageModPlayerQuickLook.appex/Contents/MacOS/SavageModPlayerQuickLook"

      # In CI ist der gitignorierte audio/-Ordner nicht vorhanden, daher skippen
      # die Audio-/Hardware-abhaengigen Tests von selbst; die synthetischen
      # DSP-/Parser-/Sequenzierungs-Tests laufen vollstaendig. Der 256-Voice-
      # Stresstest misst Release-Echtzeitfaehigkeit und braucht daher denselben
      # optimierten Build wie die ausgelieferte App.
      - name: Swift tests
        run: swift test -c release

      - name: JS Syntax-Check
        run: |
          node --check modplayer.js
          node --check mod-player-worklet.js

      - name: JS↔Swift Worklet-Parität (headless)
        run: node Tests/js/worklet-timing.mjs

      - name: Single-File-HTML ist aktuell (build.py)
        run: |
          python3 build.py
          if ! git diff --exit-code savage-mod-player.html; then
            echo "::error::savage-mod-player.html ist veraltet. 'python3 build.py' ausfuehren und committen."
            exit 1
          fi

  ios-build-test:
    # Baut die iPhone-App fuers Simulator-SDK und laeuft ihre Xcode-Tests —
    # sonst koennte das komplette iOS-Target brechen, waehrend die uebrigen
    # Jobs gruen bleiben. Eigener Job, damit macOS-Paket- und iOS-Pfad
    # parallel laufen.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Xcode Version
        run: xcodebuild -version

      - name: Simulator-Build
        run: bash ios/scripts/build-simulator.sh

      - name: Simulator-Tests
        run: bash ios/scripts/run-tests.sh

  linux-build-test:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libasound2-dev libarchive-tools

      - name: Swift Version
        run: swift --version

      - name: Swift build (release)
        run: swift build -c release

      - name: Swift tests (release)
        run: swift test -c release
