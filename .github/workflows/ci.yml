name: CI

# Baut die native Swift-App, laeuft die Tests, prueft die JS-Parität und
# stellt sicher, dass die gebaute Single-File-HTML aktuell ist.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # macos-15 bringt standardmaessig Xcode 16 / Swift 6.0 mit; der aeltere
    # macos-14-Runner hatte nur Swift 5.10 und scheiterte an
    # 'swift-tools-version: 6.0' in Package.swift.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Kontext- und Doku-Regeln
        run: python3 Tests/context_hygiene_tests.py

      # Die UI-Quelltests kodieren die Pflichtbedienelemente des kompakten
      # Transports — ohne diesen Schritt koennten sie verschwinden, ohne dass
      # CI rot wird.
      - name: UI-Quelltests
        run: python3 Tests/ui_source_tests.py

      # Schutzregeln im Quelltext und kontrollierte Skriptläufe mit temporären
      # Dateien prüfen; die Systeminstallation und Notarisierung bleiben unberührt.
      - name: Build-, Release-, Start- und Referenztests
        run: |
          python3 Tests/build_script_tests.py
          python3 Tests/publish_contract_tests.py
          python3 Tests/sparkle_contract_tests.py
          python3 Tests/cloudkit_signing_tests.py
          python3 Tests/launch_smoke_contract_tests.py
          python3 Tests/desktop_entry_tests.py
          python3 Tests/reference_compare_tests.py

      - name: Linux update validation
        run: |
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 Tests/linux_update_tests.py

      - name: Swift Version
        run: swift --version

      - name: Swift build (release)
        run: swift build -c release

      # Die Exit-Code-Zusagen der einzigen kopflosen Schnittstelle: ungueltige
      # Zahlparameter muessen vor Parse und Render mit 2 enden, eine fehlende
      # Datei mit 1. Laeuft direkt nach dem Release-Build, weil der Test das
      # gebaute savage-cli benutzt und sich sonst nur ueberspringen wuerde.
      - name: savage-cli Vertrag (Exit-Codes, Zahlgrenzen)
        run: python3 Tests/cli_contract_tests.py

      # Quick-Look-Appex und App-Bundle entstehen NUR in build_app.sh (eigener
      # swiftc-Aufruf) — swift build allein wuerde Build- oder Plist-Fehler der
      # ausgelieferten Extension nicht bemerken. SIGN_APP=0: unsignierter Lauf,
      # auf dem Runner gibt es keine Developer-ID.
      - name: App-Bundle samt Quick-Look-Appex (unsigniert)
        run: |
          SIGN_APP=0 bash build_app.sh
          plutil -lint "Savage Mod Player.app/Contents/Info.plist"
          plutil -lint "Savage Mod Player.app/Contents/PlugIns/SavageModPlayerQuickLook.appex/Contents/Info.plist"
          test -x "Savage Mod Player.app/Contents/MacOS/SavageModPlayerApp"
          test -x "Savage Mod Player.app/Contents/PlugIns/SavageModPlayerQuickLook.appex/Contents/MacOS/SavageModPlayerQuickLook"

      # In CI ist der gitignorierte audio/-Ordner nicht vorhanden, daher skippen
      # die Audio-/Hardware-abhaengigen Tests von selbst; die synthetischen
      # DSP-/Parser-/Sequenzierungs-Tests laufen vollstaendig. Der 256-Voice-
      # Stresstest misst Release-Echtzeitfaehigkeit und braucht daher denselben
      # optimierten Build wie die ausgelieferte App.
      - name: Swift tests
        run: swift test -c release

      - name: JS Syntax-Check
        run: |
          node --check modplayer.js
          node --check mod-player-worklet.js

      - name: JS↔Swift Worklet-Parität (headless)
        run: |
          node Tests/js/worklet-timing.mjs
          node Tests/js/playback-state.mjs

      - name: Browser-MOD-Parser-Grenzen (headless)
        run: node Tests/js/pattern-bounds.mjs

      - name: Single-File-HTML ist aktuell (build.py)
        run: |
          python3 build.py
          if ! git diff --exit-code savage-mod-player.html; then
            echo "::error::savage-mod-player.html ist veraltet. 'python3 build.py' ausfuehren und committen."
            exit 1
          fi

  ios-build-test:
    # Baut die iPhone-App fuers Simulator-SDK und laeuft ihre Xcode-Tests —
    # sonst koennte das komplette iOS-Target brechen, waehrend die uebrigen
    # Jobs gruen bleiben. Eigener Job, damit macOS-Paket- und iOS-Pfad
    # parallel laufen.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Xcode Version
        run: xcodebuild -version

      - name: Simulator-Build
        run: bash ios/scripts/build-simulator.sh

      - name: Simulator-Tests
        run: bash ios/scripts/run-tests.sh

  linux-build-test:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libasound2-dev libdbus-1-dev zlib1g-dev libarchive-tools

      - name: Swift Version
        run: swift --version

      - name: Swift build (release)
        run: swift build -c release

      - name: Swift tests (release)
        run: swift test -c release

  linux-gui-test:
    runs-on: ubuntu-24.04
    container: swift:6.2.1-noble
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Linux GUI dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake g++ pkg-config libasound2-dev libdbus-1-dev zlib1g-dev python3 python3-gi openssl dbus-x11 desktop-file-utils ffmpeg qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtmultimedia qml6-module-qtqml-workerscript qml6-module-qtquick-templates
      - name: Build GUI and static engine
        run: |
          cmake -S linux/gui -B .build/linux-gui -DCMAKE_BUILD_TYPE=Release
          cmake --build .build/linux-gui --parallel 4
          swift build -c release --static-swift-stdlib --product savage-desktop-engine --jobs 4
          cp .build/release/savage-desktop-engine .build/linux-gui/
      - name: Update and desktop contracts
        run: |
          python3 Tests/linux_update_tests.py
          ctest --test-dir .build/linux-gui --output-on-failure
          dbus-run-session -- python3 Tests/linux_update_integration.py
          SAVAGE_DESKTOP_ENGINE="$PWD/.build/linux-gui/savage-desktop-engine" SAVAGE_VIDEO_RENDERER="$PWD/.build/linux-gui/savage-mod-player" python3 Tests/desktop_engine_tests.py
          SAVAGE_DESKTOP_ENGINE="$PWD/.build/linux-gui/savage-desktop-engine" SAVAGE_GUI="$PWD/.build/linux-gui/savage-mod-player" dbus-run-session -- python3 Tests/linux_gui_tests.py
          dbus-run-session -- /usr/lib/qt6/bin/qmltestrunner -input Tests/qml/tst_visualizer_visibility.qml
      - name: Package Linux GUI
        run: bash linux/package-gui.sh
