name: Publish Sparkle appcast

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag, for example v1.6.32
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sparkle-appcast
  cancel-in-progress: false

jobs:
  appcast:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: macos-15
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify latest stable release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]] || exit 1
          state="$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          [[ "$state" == $'false\tfalse' ]] || {
            echo "FEHLER: Entwürfe und Prereleases gehören nicht in den Update-Feed." >&2; exit 1;
          }
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$latest" == "$RELEASE_TAG" ]] || {
            echo "FEHLER: Nur das neueste stabile Release darf in den Update-Feed." >&2; exit 1;
          }

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Download and verify release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p update site
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir update
          shopt -s nullglob
          dmgs=(update/*.dmg)
          [[ ${#dmgs[@]} == 1 ]] || {
            echo "FEHLER: Genau ein Release-DMG erwartet." >&2; exit 1;
          }
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body \
            > "${dmgs[0]%.dmg}.md"
          bash scripts/verify-sparkle-release.sh "${dmgs[0]}" "$RELEASE_TAG"

      # Paketmanifeste und Compiler laufen ohne den privaten Update-Schlüssel.
      - name: Prepare pinned Sparkle tools
        shell: bash
        run: |
          swift package resolve
          swiftc scripts/verify-sparkle-feed.swift -o .build/verify-sparkle-feed

      - name: Generate signed appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          private_key="$SPARKLE_PRIVATE_KEY"
          unset SPARKLE_PRIVATE_KEY
          [[ -n "$private_key" ]] || { echo "FEHLER: SPARKLE_PRIVATE_KEY fehlt." >&2; exit 1; }
          tool="$(find .build/artifacts/sparkle -type f -name generate_appcast -print -quit)"
          signer="$(find .build/artifacts/sparkle -type f -name sign_update -print -quit)"
          [[ -x "$tool" && -x "$signer" ]] || exit 1
          # Geheimer Schlüssel ausschließlich über stdin, nie in argv oder Logs.
          printf '%s' "$private_key" | "$tool" --ed-key-file - \
            --embed-release-notes --maximum-versions 1 --maximum-deltas 0 \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            -o "$PWD/site/appcast.xml" "$PWD/update"
          printf '%s' "$private_key" | "$signer" --ed-key-file - \
            --disable-signing-warning site/appcast.xml
          unset private_key
          xmllint --noout site/appcast.xml
          dmg=(update/*.dmg)
          .build/verify-sparkle-feed site/appcast.xml .build/sparkle-release/Info.plist "${dmg[0]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      # Ein inzwischen erschienenes Release darf ein wartender alter Lauf nicht ablösen.
      - name: Recheck latest release before deployment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$RELEASE_TAG" ]] || exit 1

      - name: Deploy appcast
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
